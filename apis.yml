name: Chickin
description: Chickin is an Indonesian poultry-technology company operating a full-stack, integrated ecosystem
  for chicken farmers across Indonesia. It combines closed-house smart-farming hardware (IoT climate and
  environmental controllers), day-old-chick and feed supply, farmer financing, and guaranteed offtake and
  distribution of live birds, aiming to modernize and de-risk small and mid-scale poultry farming. Backed by
  500 Global, Chickin runs its operations through a mobile and web application at chickin.id. As of this
  enrichment pass the company publishes no public developer program, API documentation, or machine-readable
  API artifacts; this profile records its public web presence and domain-security posture and remains a
  lead for further enrichment should a developer surface be published.
